<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="button" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Calculator body -->
  <rect x="100" y="80" width="312" height="352" rx="30" fill="#2d2d44" stroke="url(#accent)" stroke-width="8"/>
  
  <!-- Display -->
  <rect x="120" y="100" width="272" height="100" rx="15" fill="#1a1a2e"/>
  <text x="390" y="170" font-family="Arial, sans-serif" font-size="48" fill="#667eea" text-anchor="end" font-weight="bold">3.14159</text>
  
  <!-- Pi symbol -->
  <text x="140" y="160" font-family="serif" font-size="72" fill="#f5576c" font-weight="bold">π</text>
  
  <!-- Calculator buttons grid -->
  <!-- Row 1 -->
  <rect x="120" y="220" width="60" height="50" rx="10" fill="#3d3d5c"/>
  <text x="150" y="252" font-family="Arial" font-size="24" fill="#667eea" text-anchor="middle">√</text>
  
  <rect x="190" y="220" width="60" height="50" rx="10" fill="#3d3d5c"/>
  <text x="220" y="252" font-family="Arial" font-size="24" fill="#667eea" text-anchor="middle">x²</text>
  
  <rect x="260" y="220" width="60" height="50" rx="10" fill="#3d3d5c"/>
  <text x="290" y="252" font-family="Arial" font-size="24" fill="#667eea" text-anchor="middle">sin</text>
  
  <rect x="330" y="220" width="60" height="50" rx="10" fill="#3d3d5c"/>
  <text x="360" y="252" font-family="Arial" font-size="24" fill="#667eea" text-anchor="middle">cos</text>
  
  <!-- Row 2 -->
  <rect x="120" y="280" width="60" height="50" rx="10" fill="#3d3d5c"/>
  <text x="150" y="312" font-family="Arial" font-size="28" fill="#a78bfa" text-anchor="middle">7</text>
  
  <rect x="190" y="280" width="60" height="50" rx="10" fill="#3d3d5c"/>
  <text x="220" y="312" font-family="Arial" font-size="28" fill="#a78bfa" text-anchor="middle">8</text>
  
  <rect x="260" y="280" width="60" height="50" rx="10" fill="#3d3d5c"/>
  <text x="290" y="312" font-family="Arial" font-size="28" fill="#a78bfa" text-anchor="middle">9</text>
  
  <rect x="330" y="280" width="60" height="50" rx="10" fill="url(#button)"/>
  <text x="360" y="312" font-family="Arial" font-size="28" fill="white" text-anchor="middle">×</text>
  
  <!-- Row 3 -->
  <rect x="120" y="340" width="60" height="50" rx="10" fill="#3d3d5c"/>
  <text x="150" y="372" font-family="Arial" font-size="28" fill="#a78bfa" text-anchor="middle">4</text>
  
  <rect x="190" y="340" width="60" height="50" rx="10" fill="#3d3d5c"/>
  <text x="220" y="372" font-family="Arial" font-size="28" fill="#a78bfa" text-anchor="middle">5</text>
  
  <rect x="260" y="340" width="60" height="50" rx="10" fill="#3d3d5c"/>
  <text x="290" y="372" font-family="Arial" font-size="28" fill="#a78bfa" text-anchor="middle">6</text>
  
  <rect x="330" y="340" width="60" height="50" rx="10" fill="url(#button)"/>
  <text x="360" y="372" font-family="Arial" font-size="28" fill="white" text-anchor="middle">÷</text>
  
  <!-- Row 4 -->
  <rect x="120" y="400" width="60" height="30" rx="8" fill="#3d3d5c"/>
  <text x="150" y="422" font-family="Arial" font-size="28" fill="#a78bfa" text-anchor="middle">1</text>
  
  <rect x="190" y="400" width="60" height="30" rx="8" fill="#3d3d5c"/>
  <text x="220" y="422" font-family="Arial" font-size="28" fill="#a78bfa" text-anchor="middle">2</text>
  
  <rect x="260" y="400" width="60" height="30" rx="8" fill="#3d3d5c"/>
  <text x="290" y="422" font-family="Arial" font-size="28" fill="#a78bfa" text-anchor="middle">3</text>
  
  <rect x="330" y="400" width="60" height="30" rx="8" fill="url(#button)"/>
  <text x="360" y="422" font-family="Arial" font-size="28" fill="white" text-anchor="middle">+</text>
  
  <!-- Decorative elements -->
  <circle cx="450" cy="100" r="20" fill="none" stroke="#667eea" stroke-width="3" opacity="0.5"/>
  <circle cx="450" cy="100" r="8" fill="#667eea" opacity="0.3"/>
  
  <circle cx="60" cy="400" r="15" fill="none" stroke="#f5576c" stroke-width="3" opacity="0.5"/>
  <circle cx="60" cy="400" r="6" fill="#f5576c" opacity="0.3"/>
</svg>